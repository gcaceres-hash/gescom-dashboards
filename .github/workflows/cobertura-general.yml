name: Cobertura General

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escribir config.json desde el secret
        shell: bash
        run: echo '${{ secrets.GESCOM_CONFIG }}' > scripts/config.json

      - name: Correr pull-cobertura-general.ps1
        shell: pwsh
        run: ./scripts/pull-cobertura-general.ps1

      - name: Publicar cambios (commit + push a docs/cobertura)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cobertura
          git diff --cached --quiet || git commit -m "Actualiza Cobertura General"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rechazado (el repo avanzo mientras corria) -- reintentando ($i)..."
            git fetch origin
            git merge origin/main -X ours -m "Merge automatico" --no-edit
            sleep 5
          done
