name: Combo Cobertura Softys

on:
  schedule:
    - cron: "30 11 * * 1-6"
    - cron: "30 14 * * 1-6"
    - cron: "30 17 * * 1-6"
    - cron: "30 20 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escribir panel-config.json desde el secret
        shell: bash
        run: echo '${{ secrets.PANEL_CONFIG }}' > scripts/panel-config.json

      - name: Correr pull-combo-softys.ps1
        shell: pwsh
        run: ./scripts/pull-combo-softys.ps1

      - name: Publicar cambios (commit + push a docs/combo-softys)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/combo-softys
          git diff --cached --quiet || git commit -m "Actualiza Combo Cobertura Softys"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rechazado (el repo avanzo mientras corria) -- reintentando ($i)..."
            git fetch origin
            git merge origin/main -X ours -m "Merge automatico" --no-edit
            sleep 5
          done
