name: Compras - Stock y Pedidos

on:
  schedule:
    - cron: "40 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escribir panel-config.json desde el secret
        shell: bash
        run: echo '${{ secrets.PANEL_CONFIG }}' > scripts/panel-config.json

      - name: Correr pull-compras-stock.ps1
        shell: pwsh
        run: ./scripts/pull-compras-stock.ps1

      - name: Cifrar datos antes de publicar (solo si hay contrasena configurada)
        shell: pwsh
        run: ./scripts/protect-tableros.ps1 -Modo Cifrar -Tableros compras-stock

      - name: Publicar cambios (commit + push a docs/compras-stock)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/compras-stock
          git diff --cached --quiet || git commit -m "Actualiza Compras - Stock y Pedidos"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rechazado (el repo avanzo mientras corria) -- reintentando ($i)..."
            git fetch origin
            git merge origin/main -X ours -m "Merge automatico" --no-edit
            sleep 5
          done
