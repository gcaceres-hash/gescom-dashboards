name: Pizarra de Rentabilidad

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escribir config.json desde el secret
        shell: bash
        run: echo '${{ secrets.GESCOM_CONFIG }}' > scripts/config.json

      - name: Correr pull-venta-rentabilidad.ps1
        shell: pwsh
        run: ./scripts/pull-venta-rentabilidad.ps1

      - name: Publicar cambios (commit + push a docs/rentabilidad)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rentabilidad
          git diff --cached --quiet || git commit -m "Actualiza Pizarra de Rentabilidad"
          git push
