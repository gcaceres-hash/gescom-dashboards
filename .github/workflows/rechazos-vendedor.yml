name: Rechazos y Devoluciones

on:
  schedule:
    # Antes coincidia con Clientes Potenciales (45 10 * * *) -- se corre 25
    # min mas tarde para que no arranquen los dos al mismo tiempo y choquen
    # al hacer push (ademas del reintento automatico agregado mas abajo).
    - cron: "10 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escribir config.json desde el secret
        shell: bash
        run: echo '${{ secrets.GESCOM_CONFIG }}' > scripts/config.json

      - name: Correr pull-rechazos-vendedor.ps1
        shell: pwsh
        run: ./scripts/pull-rechazos-vendedor.ps1

      - name: Publicar cambios (commit + push a docs/rechazos)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rechazos
          git diff --cached --quiet || git commit -m "Actualiza Rechazos y Devoluciones"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rechazado (el repo avanzo mientras corria) -- reintentando ($i)..."
            git fetch origin
            git merge origin/main -X ours -m "Merge automatico" --no-edit
            sleep 5
          done
