name: Inteligencia Comercial Softys

on:
  schedule:
    - cron: "10 11 * * 1-5"
    - cron: "10 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escribir panel-config.json desde el secret
        shell: bash
        run: echo '${{ secrets.PANEL_CONFIG }}' > scripts/panel-config.json

      - name: Correr pull-softys-ic.ps1 (descifra los objetivos si hace falta)
        shell: pwsh
        run: ./scripts/pull-softys-ic.ps1

      - name: Cifrar datos antes de publicar
        shell: pwsh
        run: ./scripts/protect-tableros.ps1 -Modo Cifrar -Tableros softys-ic

      - name: Publicar cambios (commit + push a docs/softys-ic)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/softys-ic
          git diff --cached --quiet || git commit -m "Actualiza Inteligencia Comercial Softys"
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rechazado (el repo avanzo mientras corria) -- reintentando ($i)..."
            git fetch origin
            git merge origin/main -X ours -m "Merge automatico" --no-edit
            sleep 5
          done
