name: Seguimiento Martin Di Giorno

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escribir config.json desde el secret
        shell: bash
        run: echo '${{ secrets.GESCOM_CONFIG }}' > scripts/config.json

      - name: Correr pull-vendedor-digiorno.ps1
        shell: pwsh
        run: ./scripts/pull-vendedor-digiorno.ps1

      - name: Publicar cambios (commit + push a docs/digiorno)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digiorno
          git diff --cached --quiet || git commit -m "Actualiza Seguimiento Di Giorno"
          git push
